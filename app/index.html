<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>약물 학습기 · 다빈도 처방 약물</title>
  <meta name="description" content="다빈도 처방 약물 300종을 단원·레슨으로 체계적으로 익히는 학습 앱" />
  <!-- 모바일/PWA -->
  <meta name="theme-color" content="#0f1420" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="약물 학습기" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">℞</span>
      <div>
        <h1>약물 학습기</h1>
        <p class="subtitle">다빈도 처방 약물 · 체계적 학습</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="home"><span class="t-full">홈</span><span class="t-short">홈</span></button>
      <button class="tab" data-view="learn"><span class="t-full">학습</span><span class="t-short">학습</span></button>
      <button class="tab" data-view="review"><span class="t-full">복습</span><span class="t-short">복습</span> <span class="badge" id="dueBadge">0</span></button>
      <button class="tab" data-view="quiz"><span class="t-full">퀴즈</span><span class="t-short">퀴즈</span></button>
      <button class="tab" data-view="flow"><span class="t-full">쏙쏙</span><span class="t-short">쏙쏙</span></button>
      <button class="tab" data-view="stems"><span class="t-full">어간 사전</span><span class="t-short">어간</span></button>
    </nav>
  </header>

  <main id="app">
    <!-- 홈 -->
    <section class="view active" id="view-home">
      <div id="homeArea"></div>
    </section>

    <!-- 학습 (커리큘럼) -->
    <section class="view" id="view-learn">
      <div class="view-head">
        <h2>학습 <span class="muted small">단원 · 레슨</span></h2>
        <p class="muted">카테고리(단원)를 펼쳐 계열(레슨)을 하나씩 마스터하세요.</p>
      </div>
      <div id="curriculum"></div>
    </section>

    <!-- 복습 (SRS) -->
    <section class="view" id="view-review">
      <div class="view-head">
        <h2>복습 <span class="muted small">간격반복 + 인출연습</span></h2>
        <p class="muted">먼저 답을 떠올린 뒤 카드를 탭해 확인하고, 기억한 정도를 평가하세요.</p>
      </div>
      <div id="reviewArea"></div>
    </section>

    <!-- 퀴즈 -->
    <section class="view" id="view-quiz">
      <div class="view-head">
        <h2>랜덤 퀴즈 <span class="muted small">인터리빙 · 변별력</span></h2>
        <p class="muted">여러 계열을 섞어 출제합니다. 헷갈리는 계열을 구분하는 힘을 기릅니다.</p>
      </div>
      <div id="quizArea"></div>
    </section>

    <!-- 쏙쏙 (자동 흘려보기) -->
    <section class="view" id="view-flow">
      <div class="view-head">
        <h2>쏙쏙 <span class="muted small">자동 흘려보기</span></h2>
        <p class="muted">보고만 있어도 핵심이 들어와요. 약이 일정 간격으로 넘어갑니다.</p>
      </div>
      <div id="flowArea"></div>
    </section>

    <!-- 어간 사전 -->
    <section class="view" id="view-stems">
      <div class="view-head">
        <h2>어간 사전 <span class="muted small">내장 니모닉</span></h2>
        <p class="muted">어간만 외우면 수백 개 약의 계열을 추론할 수 있습니다.</p>
      </div>
      <div class="stem-grid" id="stemGrid"></div>
    </section>
  </main>

  <!-- 레슨 오버레이 (정독 학습 → 연습문제 → 결과) -->
  <div id="studyOverlay" class="study-overlay" hidden>
    <div class="study-inner" id="studyInner"></div>
  </div>

  <footer class="footer">
    <span id="footStats"></span>
    <button class="link-btn" id="resetBtn" title="학습 기록 초기화">기록 초기화</button>
  </footer>

  <script src="data/drugs.js"></script>
  <script src="data/stems.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
